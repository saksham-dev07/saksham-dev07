<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="35%" stop-color="#121624" />
      <stop offset="70%" stop-color="#1c1d3b" />
      <stop offset="100%" stop-color="#2d2254" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF" />
      <stop offset="50%" stop-color="#A371F7" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="waveGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="waveGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6C63FF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: url(#neonGradient);
        letter-spacing: 1.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        font-size: 15px;
        fill: #C9D1D9;
        letter-spacing: 2px;
      }
      .tag {
        font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #8B949E;
      }
      .grid-dot {
        fill: #6c63ff;
        opacity: 0.25;
      }
      .wave-anim1 {
        animation: floatWave 8s ease-in-out infinite alternate;
      }
      .wave-anim2 {
        animation: floatWave2 6s ease-in-out infinite alternate;
      }
      @keyframes floatWave {
        0% { transform: translateY(0px) scaleY(1); }
        100% { transform: translateY(6px) scaleY(1.05); }
      }
      @keyframes floatWave2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="220" rx="14" fill="url(#bgGradient)" />

  <!-- Background Tech Grid Pattern -->
  <g opacity="0.35">
    <circle cx="50" cy="30" r="1.5" class="grid-dot" />
    <circle cx="100" cy="30" r="1.5" class="grid-dot" />
    <circle cx="150" cy="30" r="1.5" class="grid-dot" />
    <circle cx="200" cy="30" r="1.5" class="grid-dot" />
    <circle cx="250" cy="30" r="1.5" class="grid-dot" />
    <circle cx="650" cy="30" r="1.5" class="grid-dot" />
    <circle cx="700" cy="30" r="1.5" class="grid-dot" />
    <circle cx="750" cy="30" r="1.5" class="grid-dot" />
    <circle cx="800" cy="30" r="1.5" class="grid-dot" />
    <circle cx="850" cy="30" r="1.5" class="grid-dot" />

    <circle cx="50" cy="70" r="1.5" class="grid-dot" />
    <circle cx="100" cy="70" r="1.5" class="grid-dot" />
    <circle cx="800" cy="70" r="1.5" class="grid-dot" />
    <circle cx="850" cy="70" r="1.5" class="grid-dot" />

    <circle cx="50" cy="110" r="1.5" class="grid-dot" />
    <circle cx="850" cy="110" r="1.5" class="grid-dot" />
  </g>

  <!-- Floating Glowing Orbs -->
  <circle cx="120" cy="50" r="80" fill="#6C63FF" opacity="0.15" filter="url(#glow)" />
  <circle cx="780" cy="60" r="90" fill="#00F5FF" opacity="0.12" filter="url(#glow)" />
  <circle cx="450" cy="40" r="70" fill="#A371F7" opacity="0.10" filter="url(#glow)" />

  <!-- Bottom Wave Layer 1 -->
  <path class="wave-anim1" d="M0 160 C 150 130, 320 200, 480 165 C 640 130, 780 185, 900 150 L900 220 L0 220 Z" fill="url(#waveGradient1)" />

  <!-- Bottom Wave Layer 2 -->
  <path class="wave-anim2" d="M0 180 C 180 150, 360 210, 540 175 C 720 140, 810 195, 900 175 L900 220 L0 220 Z" fill="url(#waveGradient2)" />

  <!-- Border Accent Line -->
  <rect x="1" y="1" width="898" height="218" rx="13" stroke="url(#neonGradient)" stroke-width="1.5" stroke-opacity="0.35" fill="none" />

  <!-- Terminal Badge -->
  <g transform="translate(365, 26)">
    <rect x="0" y="0" width="170" height="24" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#00F5FF" />
    <text x="26" y="16" class="tag">SYSTEM : ONLINE</text>
  </g>

  <!-- Header Name with Glow -->
  <text x="450" y="105" text-anchor="middle" class="title" filter="url(#textGlow)">Saksham Agarwal</text>

  <!-- Subtitle -->
  <text x="450" y="142" text-anchor="middle" class="subtitle">FULL-STACK ENGINEER  •  AI AGENTS &amp; ML  •  CYBERSECURITY</text>

</svg>
